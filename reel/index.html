<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDDLE STUDIES REEL — monaka design.</title>
<meta name="description" content="Fifteen-second motion studies.">
<style>
  :root {
    --bg: #111110;
    --fg: #f2f1ee;
    --mute: #8c8a85;
    --line: #262523;
    --panel: #1b1a19;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  nav {
    padding: 24px 40px;
    display: flex;
    gap: 28px;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--mute);
    border-bottom: 1px solid var(--line);
  }
  nav a { text-decoration: none; }
  nav a:hover, nav a[aria-current] { color: var(--fg); }
  header {
    padding: 12vh 40px 8vh;
    display: grid;
    grid-template-columns: 1fr;
  }
  .kicker { font-size: 11px; letter-spacing: 0.3em; color: var(--mute); margin-bottom: 24px; }
  h1 {
    font-size: clamp(44px, 8.4vw, 128px);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 0.92;
  }
  .feature { padding: 0 40px 12vh; }
  .feature video, .card video {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    display: block;
    background: var(--panel);
  }
  .meta { margin-top: 18px; display: flex; justify-content: space-between; gap: 16px; font-size: 11px; letter-spacing: 0.22em; color: var(--mute); }
  .feature h2 { margin-top: 14px; font-size: clamp(28px, 3.4vw, 48px); font-weight: 700; letter-spacing: -0.02em; }
  .archive-head {
    padding: 0 40px 24px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--mute);
    border-top: 1px solid var(--line);
    padding-top: 40px;
  }
  .grid {
    padding: 0 40px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr));
    gap: 56px 40px;
  }
  .card { text-decoration: none; display: block; }
  .card h3 { margin-top: 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .empty { padding: 0 40px 10vh; font-size: 14px; color: var(--mute); }
  footer { padding: 10vh 40px; border-top: 1px solid var(--line); font-size: 12px; color: var(--mute); line-height: 2; }
  footer strong { color: var(--fg); }
  @media (max-width: 720px) {
    nav { padding: 20px 16px; gap: 20px; }
    header { grid-template-columns: 1fr; padding: 8vh 16px 6vh; gap: 28px; }
    .feature { padding: 0 16px 10vh; }
    .archive-head { padding: 32px 16px 20px; }
    .grid { padding: 0 16px 24px; }
    .empty { padding: 0 16px 8vh; }
    footer { padding: 8vh 16px; }
  }
</style>
</head>
<body>
<nav>
  <a href="../">I</a>
  <a href="../ii/">II</a>
  <a href="./" aria-current="page">REEL</a>
</nav>
<header>
  <div>
    <div class="kicker">MIDDLE STUDIES REEL</div>
    <h1>Fifteen<br>seconds,<br>every day.</h1>
  </div>
</header>
<section class="feature" id="feature"></section>
<div class="archive-head" id="archive-head" hidden>ARCHIVE</div>
<main class="grid" id="grid"></main>
<footer>
  <strong>monaka design.</strong><br>
  We wrap your vision in design.
</footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('works.json')
  .then(r => r.json())
  .then(works => {
    const feature = document.getElementById('feature');
    if (!works.length) {
      feature.innerHTML = '<p class="empty">第1作は準備中です。</p>';
      return;
    }
    const list = works.slice().reverse();
    const w = list[0], dir = `works/${w.id}_${w.slug}`;
    feature.innerHTML = `
      <video src="${esc(w.video)}" poster="${dir}/poster.jpg" autoplay loop muted playsinline controls preload="auto"></video>
      <div class="meta"><span>REEL / ${esc(w.id)} — LATEST</span><span>${esc(w.date)}</span></div>
      <h2>${esc(w.title)}</h2>`;
    const rest = list.slice(1);
    if (!rest.length) return;
    document.getElementById('archive-head').hidden = false;
    const grid = document.getElementById('grid');
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause();
    }), { rootMargin: '200px' }) : null;
    rest.forEach(w => {
      const dir = `works/${w.id}_${w.slug}`;
      const a = document.createElement('div');
      a.className = 'card';
      a.innerHTML = `
        <video data-src="${esc(w.video)}" poster="${dir}/poster.jpg" loop muted playsinline controls preload="none"></video>
        <div class="meta"><span>REEL / ${esc(w.id)}</span><span>${esc(w.date)}</span></div>
        <h3>${esc(w.title)}</h3>`;
      grid.appendChild(a);
      const v = a.querySelector('video');
      if (io) io.observe(v); else v.src = v.dataset.src;
    });
  });
</script>
</body>
</html>
