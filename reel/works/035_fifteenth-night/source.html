  vec3 INK = mix(hx(48.,48.,48.), hx(255.,255.,255.), dark);
  vec3 INKC = mix(hx(28.,28.,28.), hx(255.,255.,255.), dark);

  if (dMoonR > 1.5 && topo > 0.0){

    float a = (1.0 - smoothstep(0.6, 1.6, qd)) * topo * exp(-dMoonR / 230.0) * smoothstep(1.5, 12.0, dMoonR);

function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }

gl.useProgram(prog);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);

if (floatLinear) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, AW, AH, 0, gl.RED, gl.FLOAT, atlas);

// ---------- choreography ----------
const LM_LOCK = () => toLock(MOON.x, MOON.y);
function toLock(x, y, zd = 1) { return { x: CX + (x - LOCK.cx) * LOCK.s * zd, y: CY + (y - LOCK.cy) * LOCK.s * zd }; }
const HERO = { s: 2.6, cx: 507, cy: 64, y: 640 };
const heroPos = i => ({ x: CX + (CEN[i].x - HERO.cx) * HERO.s, y: HERO.y + (CEN[i].y - HERO.cy) * HERO.s });
const ABSORB = [0, 12, 1, 11, 2, 10, 3, 9, 4, 8, 5, 7, 6];
const ab = {}; ABSORB.forEach((li, j) => ab[li] = j);
const SPIN = Array.from({ length: 13 }, () => (rnd() - 0.5) * 2);
const LIFT = Array.from({ length: 13 }, () => (rnd() - 0.5));
const BEATS = []; for (let b = 0.5; b <= 12.5 + 1e-6; b += 0.5) BEATS.push(+b.toFixed(2));
const ABS_T0 = 10.2, ABS_ST = 0.14, ABS_D = 0.4;
const absEnd = j => ABS_T0 + j * ABS_ST + ABS_D;
const PULSES = (() => {
  const L = [];
  for (const b of BEATS) { if (b >= 10.2 && b <= 12.5) continue; L.push({ t: b, a: (b >= 7 && b <= 9.5) ? 0.95 : 0.7 }); }
  for (let j = 0; j < 13; j++) L.push({ t: absEnd(j), a: 0.55 });
  L.push({ t: 12.5, a: 1 }); L.push({ t: 13.35, a: 0.55 }); L.push({ t: 13.85, a: 0.32 });
  return L.sort((a, b) => a.t - b.t);
})();

function moonPhaseAt(t) {
  if (t < 2.0) return 0.2;
  if (t < 4.0) {             // waxing on the beat: 0.2 → 0.5 in 4 steps
    let p = 0.2; const st = [2.0, 2.5, 3.0, 3.5];
    for (const s of st) p += 0.075 * eoBack(lin(t, s, s + 0.32), 1.2);
    return p;
  }
  if (t < 10.0) return 0.5;
  let acc = 0; for (let j = 0; j < 13; j++) acc += eo3(lin(t, absEnd(j), absEnd(j) + 0.2));
  return Math.min(1, 0.5 + 0.5 * acc / 13);
}
function wipeAt(t) {
  if (t < 0.12) return [0, 0, 0];
  if (t < 0.75) { const u = eio(lin(t, 0.12, 0.62)); return [2, lerp(2150, -420, u), 260]; }
  if (t < 12.5) return [1, 0, 0];
  if (t < 13.25) { const u = eio(lin(t, 12.5, 13.15)); return [2, lerp(-450, 2200, u), -260]; }

}
function darkAt(x, y, t) { const w = wipeAt(t); if (w[0] < 1.5) return w[0]; return x - (w[1] + w[2] * (1 - Math.pow((y - 540) / 560, 2))) > 0 ? 1 : 0; }
function camA(t) {
  const u = expoIO(lin(t, 0.3, 1.5));

  const z = t < 0.3 ? LOCK.s * push : lerp(LOCK.s * 1.04, 9.5, u);
  const cu = eio(lin(t, 0.25, 1.4));

function zMoon(t) {

}
function moonAt(t) {
  if (t < 1.5) { const c = camA(t); return { x: CX + (MOON.x - c.x) * c.z, y: CY + (MOON.y - c.y) * c.z, r: MOON.r * c.z }; }
  if (t < 4.0) return { x: CX, y: CY, r: MOON.r * zMoon(t) };

}
function endZoom(t) { return t < 13.35 ? 0.975 : lerp(0.975, 1, sineIO(lin(t, 13.35, 15))); }
function tideAt(t) { return lin(t, 6.5, 7.2) * (1 - lin(t, 9.6, 10.1)); }

// shape transforms for the mark rigidly attached to the moon circle
function markFromMoon(mo, rot = 0) {
  const s = mo.r / MOON.r;

function state(t) {
  const T = Array.from({ length: NS }, () => [0, 0, 0, 0]);
  const G = new Array(13).fill(0);
  const mo = moonAt(t); let mMoon = 0, mSplit = 0, paint = 1;
  const phase = moonPhaseAt(t);
  if (t < 1.6) {
    const c = camA(t);

          const ctrl = { x: lerp(hp.x, mo.x, 0.4), y: Math.min(hp.y, mo.y) - 220 };
          const a = (1 - uu) * (1 - uu), b = 2 * uu * (1 - uu), c = uu * uu;
          x = a * hp.x + b * ctrl.x + c * mo.x; y = a * hp.y + b * ctrl.y + c * mo.y;
          s = HERO.s * lerp(1, 0.18, ei2(u)); r = SPIN[i] * 2.4 * ei2(u);

// ---------- HUD + vector lockup ----------
const hud = document.getElementById('hud').getContext('2d');

function hudText(s, x, y, font, align, t, light = '#303030', darkc = '#999999', alpha = 1) {

}
function drawLockup(zd) {

  hud.setTransform(s, 0, 0, s, CX - LOCK.cx * s, CY - LOCK.cy * s);
  LOGO_PATHS.forEach((p, i) => { hud.fillStyle = p[1]; hud.fill(P2D[i]); });

}
function drawHud(t, st) {
  hud.clearRect(0, 0, W, H);
  if (t < 0.12 || t >= 13.4) drawLockup(t < 0.12 ? 1 : endZoom(t));
  const on = lin(t, 0.45, 0.8) * (1 - lin(t, 12.9, 13.3));
  const mono = '500 18px "Geist Mono"';
  hudText('MIDDLE STUDIES — REEL 035', 64, 72, mono, 'left', t, '#303030', '#999999', on);
  let n = t < 1.6 ? 3 : 1 + Math.round(14 * st.phase);
  hudText(`NIGHT ${String(n).padStart(2, '0')} / 15`, W - 64, 72, mono, 'right', t, '#303030', '#999999', on);
  hudText(MOON_NAMES[n - 1], W - 64, 122, '500 34px "Shippori Mincho"', 'right', t, '#303030', '#ffffff', on);
  const illum = t < 1.6 ? 0.0955 : (1 - Math.cos(Math.PI * st.phase)) / 2;
  hudText(`ILLUMINATION ${(illum * 100).toFixed(1).padStart(5, ' ')} %`, 64, H - 64, mono, 'left', t, '#303030', '#999999', on);
  const cap = lin(t, 11.9, 12.2) * (1 - lin(t, 12.9, 13.2));
  hudText('最中の月 — the full moon of the fifteenth night, which gave monaka its name', 64, H - 100, '500 20px "Shippori Mincho"', 'left', t, '#303030', '#ffffff', cap);
  hudText('Claude', W - 64, H - 64, mono, 'right', t, '#999999', '#999999', 1);
}

// ---------- seek ----------
const uPL = U('pulL'), uT = U('T'), uG = U('Gk'), uMo = U('Mo'), uMM = U('mMoon'), uMS = U('mSplit'), uPa = U('paint'), uTo = U('topo'), uTt = U('tt'), uWp = U('Wp'), uPu = U('Pu');

  gl.viewport(0, 0, W, H);
  gl.uniform4fv(uT, new Float32Array(st.T.flat()));
  gl.uniform1fv(uG, new Float32Array(st.G));
  gl.uniform4f(uMo, st.mo.x, st.mo.y, st.mo.r, st.phase);

(async () => {
  await Promise.all([document.fonts.load('500 18px "Geist Mono"'), document.fonts.load('500 34px "Shippori Mincho"', '朔二日月三十五夜上弦小望九十一二最中の—'), document.fonts.ready]);
