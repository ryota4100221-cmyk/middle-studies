<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIDDLE STUDIES REEL — 026 Morphogenesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Gloock&family=Reddit+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #08261d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* MIDDLE STUDIES REEL — 026 Morphogenesis
   Everything on screen is one Gray–Scott reaction–diffusion field (A. M. Turing, 1952).
   The field is a pure function of the frame index: state(i) = i deterministic updates from the seed,
   cached in checkpoints so __seek(t) can jump anywhere and always draws the same picture. */
const RW = 1920, RH = 1080, FPS = 60, NF = 900;
const W = 704, H = 396, N = W * H;          // simulation grid (view at zoom 1 shows 640 cells across)
const BASE = 640 / RW;                      // cells per pixel at zoom 1
const CX = W / 2, CY = H / 2;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const img = ctx.createImageData(RW, RH);
const px32 = new Uint32Array(img.data.buffer);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const ei = t => t * t * t;
function hash(i) { let x = (i ^ 0x9e3779b9) >>> 0; x = Math.imul(x ^ (x >>> 16), 0x85ebca6b); x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }

// ---------- timeline (seconds) ----------
const T = { B: 2.2, C: 4.6, D: 7.4, E: 10.6, F: 12.8, END: 15 };
const REG = {
  MIT: [0.0367, 0.0649],   // mitosis — spots that divide
  COR: [0.0545, 0.0620],   // coral growth
  MAZ: [0.0290, 0.0570],   // labyrinth
  HOL: [0.0390, 0.0580],   // negative spots
  DIE: [0.0367, 0.0720],   // nothing survives
};
const PHASES = [
  { t: 0, no: '01', name: 'Mitosis', reg: 'MIT' },
  { t: T.B, no: '02', name: 'Inoculation', reg: 'HOL' },
  { t: T.C, no: '03', name: 'Labyrinth', reg: 'MAZ' },
  { t: T.D, no: '04', name: 'Stir', reg: 'MAZ' },
  { t: T.E, no: '05', name: 'Negative', reg: 'HOL' },
  { t: T.F, no: '06', name: 'Back to one cell', reg: 'HOL' },
];
function spf(t) {                       // reaction steps per frame
  if (t < 1.2) return 60;
  if (t < T.B) return 40;
  if (t < T.C) return 26;
  if (t < T.D) return 30;
  if (t < T.E) return 18;
  if (t < T.F) return 30;
  return 20;
}

// ---------- state ----------
let U = new Float32Array(N), V = new Float32Array(N), Cc = new Float32Array(N);
let U2 = new Float32Array(N), V2 = new Float32Array(N), C2 = new Float32Array(N);
const Fm = new Float32Array(N), Km = new Float32Array(N);
const inoc = new Uint8Array(N);
let mask = null;                         // letter mask (0..1) for TURING
const SEED_R = 5.5;

function seedDot(s) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, d = Math.hypot(x - CX, y - CY);
    if (d < SEED_R) { const w = s; U[i] = lerp(U[i], 0.5, w); V[i] = lerp(V[i], 0.25 + 0.02 * (hash(i) - .5), w); }
  }
}
let U0 = null, V0 = null;
function init() {
  U.fill(1); V.fill(0); Cc.fill(0); inoc.fill(0);
  seedDot(1);
  if (!U0) {                               // let the stamped disc relax into a round cell before frame 0
    for (let i = 0; i < N; i++) { Fm[i] = REG.MIT[0]; Km[i] = REG.MIT[1]; }
    for (let s = 0; s < 24; s++) step();
    U0 = U.slice(); V0 = V.slice();
  } else { U.set(U0); V.set(V0); }
}

function buildMask() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  let size = 200; g.font = `${size}px "Climate Crisis"`;
  const w0 = g.measureText('TURING').width; size = size * (W * 0.80) / w0; g.font = `${size}px "Climate Crisis"`;
  const m = g.measureText('TURING');
  const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  g.fillText('TURING', W / 2, H / 2 + (asc - desc) / 2);
  const d = g.getImageData(0, 0, W, H).data;
  mask = new Float32Array(N);
  for (let i = 0; i < N; i++) mask[i] = d[i * 4] / 255;
}

// ---------- maps ----------
function setMaps(t) {
  const ir = t >= T.F ? irisR(t) : 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; let f, k;
    const mit = REG.MIT, cor = REG.COR, maz = REG.MAZ, hol = REG.HOL;
    if (t < T.B) { f = mit[0]; k = mit[1]; }
    else if (t < T.D) {
      const m = mask[i];
      const die = REG.DIE;
      f = lerp(die[0], hol[0], m); k = lerp(die[1], hol[1], m);
      if (t >= T.C) {                       // diagonal front sweeping left → right
        const p = lerp(-160, W + 260, eio((t - T.C) / (T.D - T.C - 0.4 > 0 ? (T.D - T.C - 0.4) : 1)));
        const s = sstep(p + 30, p - 30, x + 0.45 * (y - CY));
        f = lerp(f, maz[0], s); k = lerp(k, maz[1], s);
      }
    }
    else if (t < T.E) { f = maz[0]; k = maz[1]; }
    else if (t < T.F) {
      const r = lerp(0, 520, eo(clamp((t - T.E) / 1.6)));
      const s = sstep(r + 20, r - 20, Math.hypot(x - CX, y - CY));
      f = lerp(maz[0], hol[0], s); k = lerp(maz[1], hol[1], s);
    }
    else if (t < T.END - 0.25) {
      const o = sstep(ir - 4, ir + 4, Math.hypot(x - CX, y - CY)), die = REG.DIE;
      f = lerp(hol[0], die[0], o); k = lerp(hol[1], die[1], o);
    }
    else { f = mit[0]; k = mit[1]; }
    Fm[i] = f; Km[i] = k;
  }
}

// ---------- one reaction–diffusion step (Karl Sims form, Du=1, Dv=.5, dt=1) ----------
function step() {
  for (let y = 1; y < H - 1; y++) {
    let i = y * W + 1;
    for (let x = 1; x < W - 1; x++, i++) {
      const u = U[i], v = V[i];
      const lu = .2 * (U[i - 1] + U[i + 1] + U[i - W] + U[i + W]) + .05 * (U[i - W - 1] + U[i - W + 1] + U[i + W - 1] + U[i + W + 1]) - u;
      const lv = .2 * (V[i - 1] + V[i + 1] + V[i - W] + V[i + W]) + .05 * (V[i - W - 1] + V[i - W + 1] + V[i + W - 1] + V[i + W + 1]) - v;
      const uvv = u * v * v, f = Fm[i];
      U2[i] = u + lu - uvv + f * (1 - u);
      V2[i] = v + .5 * lv + uvv - (Km[i] + f) * v;
    }
  }
  // zero-flux edges
  for (let x = 0; x < W; x++) { U2[x] = U2[x + W]; V2[x] = V2[x + W]; U2[N - W + x] = U2[N - 2 * W + x]; V2[N - W + x] = V2[N - 2 * W + x]; }
  for (let y = 0; y < H; y++) { const i = y * W; U2[i] = U2[i + 1]; V2[i] = V2[i + 1]; U2[i + W - 1] = U2[i + W - 2]; V2[i + W - 1] = V2[i + W - 2]; }
  let s = U; U = U2; U2 = s; s = V; V = V2; V2 = s;
}

function stirAmount(t) {                 // vortex strength envelope (rad / frame at the centre)
  if (t < T.D || t >= T.E) return 0;
  const u = (t - T.D) / (T.E - T.D);
  return 0.075 * Math.pow(Math.sin(Math.PI * u), 2);
}
function sample(A, x, y) {
  x = clamp(x, 0, W - 1.001); y = clamp(y, 0, H - 1.001);
  const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = y0 * W + x0;
  return (A[i] * (1 - fx) + A[i + 1] * fx) * (1 - fy) + (A[i + W] * (1 - fx) + A[i + W + 1] * fx) * fy;
}
function advect(w) {
  const R2 = 150 * 150;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, dx = x - CX, dy = y - CY;
    const a = -w * Math.exp(-(dx * dx + dy * dy) / R2), ca = Math.cos(a), sa = Math.sin(a);
    const sx = CX + dx * ca - dy * sa, sy = CY + dx * sa + dy * ca;
    U2[i] = sample(U, sx, sy); V2[i] = sample(V, sx, sy); C2[i] = sample(Cc, sx, sy);
  }
  let s = U; U = U2; U2 = s; s = V; V = V2; V2 = s; s = Cc; Cc = C2; C2 = s;
}

function irisR(t) {                      // the dish closes while the camera dives in: radius in units of the view
  const u = clamp((t - T.F) / (T.END - T.F - 0.15));
  return Math.max(SEED_R + 0.5, (180 / cam(t).z) * lerp(2.6, 0.2, eio(u)));
}

// one frame of the world: frame j → j+1
function update(j) {
  const t = j / FPS;
  setMaps(t);
  // inoculate the letters, swept left → right
  if (t >= T.B && t < T.B + 0.7) {
    const sx = lerp(-20, W + 20, eio((t - T.B) / 0.7));
    for (let i = 0; i < N; i++) {
      if (inoc[i] || mask[i] < 0.5) continue;
      if ((i % W) > sx) continue;
      inoc[i] = 1;
      if (hash(i * 7 + 3) < 0.55) { U[i] = 0.5; V[i] = 0.25 + 0.05 * hash(i); }
      Cc[i] = 1;
    }
  }
  // saffron floods with the negative front, pink returns with the iris
  if (t >= T.E && t < T.F) {
    const r = lerp(0, 520, eo(clamp((t - T.E) / 1.6)));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, d = Math.hypot(x - CX, y - CY);
      const c = sstep(r + 6, r - 6, d); if (c > Cc[i]) Cc[i] = c;
    }
  }
  const n = spf(t);
  for (let s = 0; s < n; s++) step();
  const w = stirAmount(t); if (w > 0) advect(w);
  if (t >= T.F) {
    const r = irisR(t);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, d = Math.hypot(x - CX, y - CY);
      const o = sstep(r - 3, r + 3, d);
      if (o > 0) { U[i] = lerp(U[i], 1, o); V[i] = lerp(V[i], 0, o); }
      if (t > T.END - 0.7) Cc[i] *= 0.9;
    }
    if (j >= NF - 8) {                     // settle onto the exact cell of frame 0
      const w = (j - (NF - 8) + 1) / 8;
      for (let i = 0; i < N; i++) { U[i] = lerp(U[i], U0[i], w); V[i] = lerp(V[i], V0[i], w); Cc[i] *= 1 - w; }
    }
  }
}

// ---------- checkpointed, order-independent seek ----------
let cur = -1;
const ckpt = new Map();
function save(i) { ckpt.set(i, [U.slice(), V.slice(), Cc.slice(), inoc.slice()]); }
function restore(i) { const s = ckpt.get(i); U.set(s[0]); V.set(s[1]); Cc.set(s[2]); inoc.set(s[3]); cur = i; }
function goto(i) {
  if (cur < 0) { init(); cur = 0; save(0); }
  if (i < cur || i - cur > 60) {
    let best = 0; for (const k of ckpt.keys()) if (k <= i && k > best) best = k;
    if (!(i >= cur && cur >= best)) restore(best);
  }
  while (cur < i) { update(cur); cur++; if (cur % 60 === 0 && !ckpt.has(cur)) save(cur); }
}

// ---------- camera ----------
function cam(t) {
  let z, th = 0, cx = CX, cy = CY;
  const ZMAX = 7.5;
  if (t < T.B) z = Math.exp(lerp(Math.log(ZMAX), Math.log(2.1), eio(clamp(t / T.B))));
  else if (t < T.C) z = Math.exp(lerp(Math.log(2.1), 0, eio(clamp((t - T.B) / 0.9))));
  else if (t < T.D) { const u = (t - T.C) / (T.D - T.C); z = lerp(1.0, 1.08, eio(u)); cx = CX + 14 * Math.sin(Math.PI * u); }
  else if (t < T.E) { const u = (t - T.D) / (T.E - T.D); z = lerp(1.08, 1.0, eio(u)) + 0.42 * Math.sin(Math.PI * u); th = -0.5 * Math.sin(Math.PI * u) * Math.sin(Math.PI * u); }
  else if (t < T.F) { const u = eio((t - T.E) / (T.F - T.E)); z = lerp(1.0, 1.3, u); th = 0.16 * u; }
  else { th = 0.16 * (1 - eio(clamp((t - T.F) / (T.END - T.F)))); z = Math.exp(lerp(Math.log(1.3), Math.log(ZMAX), eio(clamp((t - T.F) / (T.END - T.F))))); }
  return { z, th, cx, cy };
}

// ---------- shading ----------
const Sh = new Float32Array(N), Sp = new Float32Array(N);
const COL = {
  ground: [8, 38, 29], ground2: [14, 61, 46],
  pink: [255, 168, 196], saff: [255, 190, 46], spec: [255, 250, 238], shadow: [3, 16, 12],
};
function shade() {
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    const gx = (V[i + 1] - V[i - 1]) * 6, gy = (V[i + W] - V[i - W]) * 6;
    // light from upper-left: surface tilted toward (-1,-1) is lit
    const nl = 1 / Math.sqrt(gx * gx + gy * gy + 1);
    const d = (gx * 0.55 + gy * 0.55 + 0.63) * nl;
    Sh[i] = 0.42 + 0.7 * clamp(d);
    // specular (Blinn, half-vector ~ (.3,.3,.9))
    const h = (gx * 0.3 + gy * 0.3 + 0.9) * nl;
    Sp[i] = 0.8 * Math.pow(clamp(h), 22);
  }
}

function render(t) {
  shade();
  const { z, th, cx, cy } = cam(t);
  const s = BASE / z, ca = Math.cos(th) * s, sa = Math.sin(th) * s;
  const TH = 0.19, WD = 0.03 / Math.pow(z, 0.8);
  const sho = 2.4 / Math.max(1, z * 0.6);       // shadow offset in cells
  const G = COL.ground, G2 = COL.ground2, P = COL.pink, Y = COL.saff, SPC = COL.spec, SD = COL.shadow;
  let o = 0;
  for (let py = 0; py < RH; py++) {
    const vy = py - RH / 2;
    let fx = cx + (-RW / 2) * ca - vy * sa, fy = cy + (-RW / 2) * sa + vy * ca;
    const vg0 = vy * vy / (RH * RH);
    for (let pxi = 0; pxi < RW; pxi++, o++, fx += ca, fy += sa) {
      let x = fx < 0 ? 0 : fx > W - 1.001 ? W - 1.001 : fx, y = fy < 0 ? 0 : fy > H - 1.001 ? H - 1.001 : fy;
      const x0 = x | 0, y0 = y | 0, ax = x - x0, ay = y - y0, i = y0 * W + x0;
      const w00 = (1 - ax) * (1 - ay), w10 = ax * (1 - ay), w01 = (1 - ax) * ay, w11 = ax * ay;
      const v = V[i] * w00 + V[i + 1] * w10 + V[i + W] * w01 + V[i + W + 1] * w11;
      const sh = Sh[i] * w00 + Sh[i + 1] * w10 + Sh[i + W] * w01 + Sh[i + W + 1] * w11;
      const sp = Sp[i] * w00 + Sp[i + 1] * w10 + Sp[i + W] * w01 + Sp[i + W + 1] * w11;
      const c = Cc[i] * w00 + Cc[i + 1] * w10 + Cc[i + W] * w01 + Cc[i + W + 1] * w11;
      // drop shadow: coverage up-left of here
      let sxx = x - sho, syy = y - sho; if (sxx < 0) sxx = 0; if (syy < 0) syy = 0;
      const sx0 = sxx | 0, sy0 = syy | 0, bx = sxx - sx0, by = syy - sy0, j = sy0 * W + sx0;
      const vs = (V[j] * (1 - bx) + V[j + 1] * bx) * (1 - by) + (V[j + W] * (1 - bx) + V[j + W + 1] * bx) * by;
      let cov = (v - TH + WD) / (2 * WD); cov = cov < 0 ? 0 : cov > 1 ? 1 : cov; cov = cov * cov * (3 - 2 * cov);
      let shd = (vs - TH + 0.06) / 0.12; shd = shd < 0 ? 0 : shd > 1 ? 1 : shd;
      const dxv = pxi / RW - 0.5, vg = 1 - 1.1 * (dxv * dxv * 0.7 + vg0);
      const gr = (G[0] + (G2[0] - G[0]) * vg), gg = (G[1] + (G2[1] - G[1]) * vg), gb = (G[2] + (G2[2] - G[2]) * vg);
      const k = shd * 0.55;
      const r0 = gr + (SD[0] - gr) * k, g0 = gg + (SD[1] - gg) * k, b0 = gb + (SD[2] - gb) * k;
      const pr = (P[0] + (Y[0] - P[0]) * c) * sh + SPC[0] * sp, pg = (P[1] + (Y[1] - P[1]) * c) * sh + SPC[1] * sp, pb = (P[2] + (Y[2] - P[2]) * c) * sh + SPC[2] * sp;
      let r = r0 + (pr - r0) * cov, g = g0 + (pg - g0) * cov, b = b0 + (pb - b0) * cov;
      r = r > 255 ? 255 : r; g = g > 255 ? 255 : g; b = b > 255 ? 255 : b;
      px32[o] = 0xff000000 | (b << 16) | (g << 8) | r;
    }
  }
  ctx.putImageData(img, 0, 0);
  hud(t);
}

// ---------- typography ----------
function phaseAt(t) { let p = PHASES[0]; for (const q of PHASES) if (t >= q.t) p = q; return p; }
let stepCount = [];
function stepsBefore(i) { if (!stepCount.length) { let s = 0; for (let j = 0; j <= NF; j++) { stepCount.push(s); s += spf(j / FPS); } } return stepCount[i]; }
function hud(t) {
  const p = phaseAt(t), i = Math.floor(t * FPS + 1e-6);
  const ink = 'rgba(244,238,226,0.92)';
  ctx.save();
  let gr = ctx.createLinearGradient(0, RH - 230, 0, RH);
  gr.addColorStop(0, 'rgba(5,28,21,0)'); gr.addColorStop(0.55, 'rgba(5,28,21,0.72)'); gr.addColorStop(1, 'rgba(5,28,21,0.9)');
  ctx.fillStyle = gr; ctx.fillRect(0, RH - 230, RW, 230);
  gr = ctx.createLinearGradient(0, 0, 0, 130);
  gr.addColorStop(0, 'rgba(5,28,21,0.85)'); gr.addColorStop(1, 'rgba(5,28,21,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, RW, 130);
  ctx.font = '600 18px "Reddit Mono"'; ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillText('MIDDLE STUDIES   REEL — 026', 56, 64);
  ctx.textAlign = 'right'; ctx.fillText('MORPHOGENESIS · GRAY–SCOTT REACTION–DIFFUSION', RW - 56, 64);
  // phase title
  const local = t - p.t, a = p.no === '01' ? 1 : 0.4 + 0.6 * clamp(local / 0.2);
  ctx.textAlign = 'left';
  ctx.font = '400 64px "Gloock"';
  ctx.globalAlpha = a; ctx.fillStyle = ink;
  ctx.fillText(p.name, 56 + 70, RH - 74 + (1 - eo(a)) * 18);
  ctx.font = '600 20px "Reddit Mono"';
  ctx.fillText(p.no, 56, RH - 96);
  ctx.globalAlpha = 1;
  const r = REG[p.reg];
  ctx.font = '400 18px "Reddit Mono"';
  ctx.fillText(`f ${r[0].toFixed(4)}   k ${r[1].toFixed(4)}   Du 1.0   Dv 0.5`, 56 + 70, RH - 44);
  ctx.textAlign = 'right';
  const st = String(stepsBefore(Math.min(i, NF))).padStart(5, '0');
  ctx.font = '600 20px "Reddit Mono"';
  ctx.fillText(`STEP ${st.slice(0, 2)} ${st.slice(2)}`, RW - 56, RH - 74);
  ctx.font = '400 18px "Reddit Mono"';
  ctx.fillText('after A. M. Turing, 1952  ·  Claude', RW - 56, RH - 44);
  ctx.restore();
}

// ---------- entry ----------
const ready = (async () => {
  await document.fonts.load('200px "Climate Crisis"', 'TURING');
  await document.fonts.load('64px "Gloock"'); await document.fonts.load('600 18px "Reddit Mono"'); await document.fonts.load('400 18px "Reddit Mono"');
  buildMask();
})();
async function seek(t) {
  await ready;
  t = ((t % 15) + 15) % 15;
  const i = Math.min(NF - 1, Math.floor(t * FPS + 1e-6));
  goto(i);
  render(i / FPS);
}
ready.then(() => {
  window.__duration = 15;
  window.__poster = 8.9;
  window.__seek = seek;
  if (!location.search.includes('render')) {
    const t0 = performance.now();
    const loop = async () => { await seek(((performance.now() - t0) / 1000) % 15); requestAnimationFrame(loop); };
    loop();
  }
});
</script>
</body>
