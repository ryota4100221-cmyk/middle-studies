<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REEL — 022 · Shatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111216; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// REEL — 022 · Shatter — Claude
// One pane of glass, ~250 shards. Every state is a pure function of t.
const W = 1920, H = 1080, DUR = 15;
window.__duration = DUR;
window.__poster = 8.75;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- seeded random ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(22022);
const rr = (a, b) => a + (b - a) * rnd();

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eoExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const v3 = (x, y, z) => [x, y, z];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const vlerp = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
// quaternions [w,x,y,z]
const qAxis = (ax, ang) => { const s = Math.sin(ang / 2); ax = norm(ax); return [Math.cos(ang / 2), ax[0] * s, ax[1] * s, ax[2] * s]; };
const qMul = (a, b) => [
  a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
  a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
  a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
  a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
function qSlerp(a, b, k) {
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  if (d < 0) { b = b.map(x => -x); d = -d; }
  if (d > 0.9995) { const r = a.map((x, i) => lerp(x, b[i], k)); const l = Math.hypot(...r); return r.map(x => x / l); }
  const th = Math.acos(d), s = Math.sin(th);
  const wa = Math.sin((1 - k) * th) / s, wb = Math.sin(k * th) / s;
  return a.map((x, i) => x * wa + b[i] * wb);
}
function qMat(q) {
  const [w, x, y, z] = q;
  return [1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y),
          2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x),
          2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y)];
}
const mv = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
function qFromBasis(x, y, z) { // columns
  const m00 = x[0], m01 = y[0], m02 = z[0], m10 = x[1], m11 = y[1], m12 = z[1], m20 = x[2], m21 = y[2], m22 = z[2];
  const tr = m00 + m11 + m22; let q;
  if (tr > 0) { const s = Math.sqrt(tr + 1) * 2; q = [.25 * s, (m21 - m12) / s, (m02 - m20) / s, (m10 - m01) / s]; }
  else if (m00 > m11 && m00 > m22) { const s = Math.sqrt(1 + m00 - m11 - m22) * 2; q = [(m21 - m12) / s, .25 * s, (m01 + m10) / s, (m02 + m20) / s]; }
  else if (m11 > m22) { const s = Math.sqrt(1 + m11 - m00 - m22) * 2; q = [(m02 - m20) / s, (m01 + m10) / s, .25 * s, (m12 + m21) / s]; }
  else { const s = Math.sqrt(1 + m22 - m00 - m11) * 2; q = [(m10 - m01) / s, (m02 + m20) / s, (m12 + m21) / s, .25 * s]; }
  const l = Math.hypot(...q); return q.map(v => v / l);
}

// monotone cubic keyframes (Fritsch–Carlson)
function track(keys) {
  const n = keys.length, ts = keys.map(k => k[0]), vs = keys.map(k => k[1]);
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((vs[i + 1] - vs[i]) / (ts[i + 1] - ts[i]));
  for (let i = 0; i < n; i++) {
    if (i === 0 || i === n - 1) m.push(0);
    else m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
  }
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return t => {
    if (t <= ts[0]) return vs[0];
    if (t >= ts[n - 1]) return vs[n - 1];
    let i = 0; while (t > ts[i + 1]) i++;
    const h = ts[i + 1] - ts[i], u = (t - ts[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * vs[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * vs[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}

// ---------- the timeline ----------
const T_HIT = 0.30, T_BREAK = 0.55;
const T_ANA0 = 5.0, T_ALIGN = 7.5, T_ALIGN1 = 8.1;
const T_SPH0 = 8.3, T_SPH1 = 10.5;
const T_BACK0 = 12.0, T_REST = 14.4;
const D = 1400, F = 1400;           // camera distance & focal: the pane at z=0 fills the frame 1:1
const IMPACT = [-250, 40];          // on the pane, in pixels from centre

// camera: yaw / pitch (deg), distance, target z
const camYaw = track([[0, 0], [0.5, 0], [1.4, -4], [3.0, 22], [5.0, -14], [6.4, 30], [T_ALIGN, 0], [T_ALIGN1, 0], [9.3, -38], [10.6, -14], [12.0, 16], [13.4, 4], [T_REST, 0], [15, 0]]);
const camPitch = track([[0, 0], [0.5, 0], [1.4, 2], [3.0, 9], [5.0, -7], [6.4, 5], [T_ALIGN, 0], [T_ALIGN1, 0], [9.3, 7], [10.6, -10], [12.0, -14], [13.4, -3], [T_REST, 0], [15, 0]]);
const camDist = track([[0, D], [0.3, D - 70], [0.55, D - 90], [1.4, D + 260], [3.0, D + 380], [4.9, D + 40], [6.4, D + 260], [T_ALIGN, D], [T_ALIGN1, D], [9.3, D + 260], [10.6, D + 120], [11.6, D - 160], [12.2, D - 60], [13.4, D + 120], [T_REST, D + 30], [15, D]]);
const camTz = track([[0, 0], [1.4, 0], [3.0, 220], [5.0, 120], [6.4, 120], [T_ALIGN, 0], [T_ALIGN1, 0], [9.3, 300], [10.6, 380], [12.0, 380], [13.4, 120], [T_REST, 0], [15, 0]]);

let cam = null;
function setCamera(t) {
  const yaw = camYaw(t) * Math.PI / 180, pit = camPitch(t) * Math.PI / 180, rho = camDist(t), tz = camTz(t);
  const T = [0, 0, tz];
  const P = [T[0] + rho * Math.sin(yaw) * Math.cos(pit), T[1] + rho * Math.sin(pit), T[2] - rho * Math.cos(yaw) * Math.cos(pit)];
  const f = norm(sub(T, P));
  const r = norm(cross([0, 1, 0], f));
  const d = cross(f, r);
  cam = { P, f, r, d, yaw, pit };
}
function toCam(p) { const q = sub(p, cam.P); return [dot(q, cam.r), dot(q, cam.d), dot(q, cam.f)]; }
function proj(p) { const c = toCam(p); return [W / 2 + F * c[0] / c[2], H / 2 + F * c[1] / c[2], c[2]]; }

// ---------- fracture: radial rays × concentric rings, jittered, clipped to the pane ----------
function clipPoly(poly, axis, val, keepLess) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const ina = keepLess ? a[axis] <= val : a[axis] >= val, inb = keepLess ? b[axis] <= val : b[axis] >= val;
    if (ina) out.push(a);
    if (ina !== inb) { const k = (val - a[axis]) / (b[axis] - a[axis]); out.push([lerp(a[0], b[0], k), lerp(a[1], b[1], k)]); }
  }
  return out;
}
const area = p => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
const centroid = p => { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; };

const shards = [];
(function fracture() {
  const NR = 24, NK = 12;
  const ang = []; let a0 = rr(0, 6.28);
  for (let j = 0; j < NR; j++) ang.push(a0 + (j + rr(-0.32, 0.32)) * Math.PI * 2 / NR);
  const radii = []; for (let k = 0; k < NK; k++) radii.push(34 * Math.pow(1.52, k) * rr(0.92, 1.08));
  const V = [];
  for (let k = 0; k < NK; k++) { V.push([]); for (let j = 0; j < NR; j++) {
    const r = radii[k] * rr(0.86, 1.14), th = ang[j] + rr(-0.06, 0.06);
    V[k].push([IMPACT[0] + r * Math.cos(th), IMPACT[1] + r * Math.sin(th)]);
  } }
  const polys = [];
  for (let j = 0; j < NR; j++) polys.push([IMPACT.slice(), V[0][j], V[0][(j + 1) % NR]]);
  for (let k = 0; k < NK - 1; k++) for (let j = 0; j < NR; j++) {
    const j1 = (j + 1) % NR, q = [V[k][j], V[k][j1], V[k + 1][j1], V[k + 1][j]];
    // big outer cells crack once more along a diagonal
    if (k >= 5 && rnd() < 0.55) {
      if (rnd() < 0.5) { polys.push([q[0], q[1], q[2]]); polys.push([q[0], q[2], q[3]]); }
      else { polys.push([q[0], q[1], q[3]]); polys.push([q[1], q[2], q[3]]); }
    } else polys.push(q);
  }
  for (let p of polys) {
    p = clipPoly(p, 0, -W / 2, false); if (p.length < 3) continue;
    p = clipPoly(p, 0, W / 2, true); if (p.length < 3) continue;
    p = clipPoly(p, 1, -H / 2, false); if (p.length < 3) continue;
    p = clipPoly(p, 1, H / 2, true); if (p.length < 3) continue;
    const A = Math.abs(area(p)); if (A < 40) continue;
    const c = centroid(p);
    shards.push({ poly: p, c, local: p.map(q => [q[0] - c[0], q[1] - c[1], 0]), R: Math.sqrt(A / Math.PI), A });
  }
})();
const N = shards.length;

// per-shard motion parameters
(function plan() {
  const maxD = Math.max(...shards.map(s => Math.hypot(s.c[0] - IMPACT[0], s.c[1] - IMPACT[1])));
  for (const s of shards) {
    const dx = s.c[0] - IMPACT[0], dy = s.c[1] - IMPACT[1], dist = Math.hypot(dx, dy) || 1;
    s.dist = dist / maxD;
    s.delay = T_BREAK + 0.16 * s.dist + rr(0, 0.04);
    const m = (1250 - 0.35 * dist) * rr(0.55, 1.15);
    const sp = Math.max(160, m);
    s.dP = [dx / dist * sp * 0.3 + rr(-90, 90), dy / dist * sp * 0.24 + rr(-70, 70), -rr(150, 750) * (1.1 - s.dist) + rr(0, 700) * s.dist];
    s.drift = [rr(-14, 14), rr(-10, 16), rr(-18, 18)];
    s.rAx = norm([rr(-1, 1), rr(-1, 1), rr(-1, 1)]);
    s.rAng = rr(1.4, 4.2) * (rnd() < 0.5 ? -1 : 1);
    s.d1 = rnd(); s.d2 = rnd(); s.d3 = rnd();
    // anamorphic home: random depth, scaled so that it projects back onto itself from the axis viewpoint (mirrored, back face out)
    const z = rr(-640, 1700), sc = (z + D) / D;
    s.aP = [-s.c[0] * sc, s.c[1] * sc, z]; s.aS = sc;
  }
  // mirror ball: fibonacci points, shards assigned by height so paths stay calm
  const idx = shards.map((s, i) => i).sort((a, b) => shards[a].c[1] - shards[b].c[1]);
  const ga = Math.PI * (3 - Math.sqrt(5));
  const Rs = 440, tgt = 2 * Rs / Math.sqrt(N) * 1.12;
  idx.forEach((si, i) => {
    const y = -1 + (i + 0.5) * 2 / N, r = Math.sqrt(1 - y * y), th = ga * i;
    const n = [r * Math.cos(th), y, r * Math.sin(th)];
    const s = shards[si];
    s.sN = n; s.sS = tgt / s.R;
    let xa = cross([0, 1, 0], n); if (Math.hypot(...xa) < 1e-3) xa = [1, 0, 0]; xa = norm(xa);
    const ya = cross(n, xa);
    s.sQ = qFromBasis(xa, ya, n); // local +z (back face) looks outward
  });
})();
const SPH_C = [0, 0, 380], SPH_R = 440;
const Q_ID = [1, 0, 0, 0], Q_FLIP = qAxis([0, 1, 0], Math.PI);

function burst(s, t) {        // explosion + slow drift, defined for all t
  const u = Math.max(0, t - s.delay);
  const e = 1 - Math.exp(-u * 3.4);
  const P = [s.c[0] + s.dP[0] * e + s.drift[0] * u, s.c[1] + s.dP[1] * e + s.drift[1] * u, s.dP[2] * e + s.drift[2] * u];
  const q = qAxis(s.rAx, s.rAng * e + 0.18 * s.rAng * u);
  return [P, q, 1];
}
function sphereState(s, t) {
  const spin = qMul(qAxis([1, 0, 0], -0.32), qAxis([0, 1, 0], 0.85 * (t - T_SPH0)));
  const m = qMat(spin);
  const P = add(SPH_C, mv(m, mul(s.sN, SPH_R)));
  return [P, qMul(spin, s.sQ), s.sS];
}
function shardState(s, t) {
  if (t < s.delay) return [[s.c[0], s.c[1], 0], Q_ID, 1];
  let st = burst(s, t);
  const k1 = eio(clamp((t - (T_ANA0 + s.d1 * 0.9)) / 1.6));
  if (k1 > 0) st = [vlerp(st[0], s.aP, k1), qSlerp(st[1], Q_FLIP, k1), lerp(1, s.aS, k1)];
  const k2 = eio(clamp((t - (T_SPH0 + s.d2 * 0.8)) / 1.4));
  if (k2 > 0) { const b = sphereState(s, t); st = [vlerp(st[0], b[0], k2), qSlerp(st[1], b[1], k2), lerp(st[2], b[2], k2)]; }
  const k3 = eio(clamp((t - (T_BACK0 + s.d3 * 0.9)) / 1.5));
  if (k3 > 0) st = [vlerp(st[0], [s.c[0], s.c[1], 0], k3), qSlerp(st[1], Q_ID, k3), lerp(st[2], 1, k3)];
  return st;
}

// ---------- textures (pane coordinates: texture pixel 0,0 = pane -960,-540) ----------
const YEL = '#ffd21a', INK = '#111216', BLUE = '#2a36ff', RED = '#ff3d1f', PAPER = '#f4f0e6';
let texA, texB, patA, patB;
function fitFont(c, text, weightFam, maxW, maxPx) {
  let px = maxPx; c.font = `${weightFam.replace('%', px)}`;
  const w = c.measureText(text).width; if (w > maxW) px = Math.floor(px * maxW / w);
  c.font = weightFam.replace('%', px); return px;
}
function buildTextures() {
  // A — the pane: a yellow warning poster
  texA = document.createElement('canvas'); texA.width = W; texA.height = H;
  let c = texA.getContext('2d');
  c.fillStyle = YEL; c.fillRect(0, 0, W, H);
  c.fillStyle = INK;
  c.fillRect(64, 64, W - 128, 10);
  c.fillRect(64, H - 74, W - 128, 10);
  c.font = '700 26px "JetBrains Mono"'; c.textBaseline = 'alphabetic';
  c.fillText('PANE 01 — FLOAT GLASS 6 MM', 64, 128);
  c.textAlign = 'right'; c.fillText('1920 × 1080 — HANDLE WITH CARE', W - 64, 128);
  c.textAlign = 'left';
  const px = fitFont(c, 'SHATTER', '800 %px "Bricolage Grotesque"', W - 150, 420);
  c.textBaseline = 'middle'; c.textAlign = 'center';
  c.fillText('SHATTER', W / 2, H / 2 + 34);
  // hazard stripes along the bottom band
  c.save(); c.beginPath(); c.rect(64, H - 150, W - 128, 52); c.clip();
  for (let x = 40; x < W + 80; x += 64) { c.beginPath(); c.moveTo(x, H - 150); c.lineTo(x + 32, H - 150); c.lineTo(x - 20, H - 98); c.lineTo(x - 52, H - 98); c.closePath(); c.fill(); }
  c.restore();
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.font = '700 22px "JetBrains Mono"';
  // target mark at the impact point
  const ix = W / 2 + IMPACT[0], iy = H / 2 + IMPACT[1];
  c.strokeStyle = RED; c.lineWidth = 7;
  c.beginPath(); c.arc(ix, iy, 92, 0, Math.PI * 2); c.stroke();
  c.lineWidth = 4; c.beginPath(); c.arc(ix, iy, 52, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.moveTo(ix - 140, iy); c.lineTo(ix + 140, iy); c.moveTo(ix, iy - 140); c.lineTo(ix, iy + 140); c.stroke();
  c.fillStyle = RED; c.beginPath(); c.arc(ix, iy, 12, 0, Math.PI * 2); c.fill();
  c.strokeStyle = RED; c.beginPath(); c.moveTo(ix + 60, iy - 140); c.lineTo(ix + 40, iy - 104); c.stroke();
  void px;

  // B — the picture that only exists from one point (stored mirrored: it is seen through the back of the glass)
  texB = document.createElement('canvas'); texB.width = W; texB.height = H;
  c = texB.getContext('2d');
  c.translate(W, 0); c.scale(-1, 1);
  c.fillStyle = BLUE; c.fillRect(0, 0, W, H);
  c.fillStyle = RED; c.beginPath(); c.arc(W * 0.68, H * 0.47, 330, 0, Math.PI * 2); c.fill();
  c.fillStyle = PAPER;
  fitFont(c, 'whole', 'italic 900 %px "Fraunces"', W - 260, 470);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('whole', W / 2, H / 2 - 10);
  c.font = '700 26px "JetBrains Mono"'; c.textBaseline = 'alphabetic';
  c.textAlign = 'left'; c.fillText('SEEN FROM ONE POINT ONLY', 64, 128);
  c.textAlign = 'right'; c.fillText(`${N} SHARDS — 2,340 MM DEEP`, W - 64, 128);
  c.fillRect(64, H - 74, W - 128, 10);
  c.textAlign = 'left'; c.fillText('x 0   y 0   z −1400', 64, H - 104);
  c.textAlign = 'right'; c.fillText('ANAMORPHOSIS', W - 64, H - 104);

  patA = ctx.createPattern(texA, 'no-repeat');
  patB = ctx.createPattern(texB, 'no-repeat');
}

// ---------- shading ----------
const LIGHT = norm([-0.45, -0.7, -0.55]);           // towards the light (up-left, in front)
function env(r) {                                     // chrome reflection colour from reflected dir
  const y = -r[1];
  if (y > 0.25) return [255, lerp(226, 246, clamp((y - .25) / .6)), lerp(196, 240, clamp((y - .25) / .6))];
  if (y > -0.05) { const k = (y + .05) / .3; return [lerp(90, 255, k), lerp(200, 226, k), lerp(255, 196, k)]; }
  const k = clamp(-y / .7); return [lerp(70, 18, k), lerp(70, 18, k), lerp(150, 26, k)];
}

// ---------- draw ----------
function pathPoly(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function drawBackground(t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 80, W / 2, H / 2, 1250);
  g.addColorStop(0, '#24262f'); g.addColorStop(1, '#0c0d10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function paneScreen() { // the resting pane as one flat picture (with the current camera)
  const tl = proj([-W / 2, -H / 2, 0]), tr = proj([W / 2, -H / 2, 0]), bl = proj([-W / 2, H / 2, 0]);
  return [(tr[0] - tl[0]) / W, (tr[1] - tl[1]) / W, (bl[0] - tl[0]) / H, (bl[1] - tl[1]) / H, tl[0], tl[1]];
}
function drawCracks(t, alpha, front) {
  if (alpha <= 0) return;
  ctx.save(); ctx.lineJoin = 'round';
  for (const s of shards) {
    const pts = s.poly.map(p => proj([p[0], p[1], 0]));
    for (let i = 0; i < pts.length; i++) {
      const a = s.poly[i], b = s.poly[(i + 1) % s.poly.length];
      if (Math.abs(a[0] - b[0]) < .5 && Math.abs(Math.abs(a[0]) - W / 2) < .5) continue;
      if (Math.abs(a[1] - b[1]) < .5 && Math.abs(Math.abs(a[1]) - H / 2) < .5) continue;
      const mx = (a[0] + b[0]) / 2 - IMPACT[0], my = (a[1] + b[1]) / 2 - IMPACT[1];
      const dd = Math.hypot(mx, my); if (dd > front) continue;
      const fade = clamp((front - dd) / 140) * alpha;
      const A = pts[i], B = pts[(i + 1) % pts.length];
      ctx.strokeStyle = `rgba(17,18,22,${0.75 * fade})`; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * fade})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(A[0] + 1.6, A[1] + 1.2); ctx.lineTo(B[0] + 1.6, B[1] + 1.2); ctx.stroke();
    }
  }
  ctx.restore();
}

// glass dust from the hit
const dust = [];
for (let i = 0; i < 240; i++) {
  const th = rr(0, Math.PI * 2), ph = rr(0.2, 1.45), sp = rr(500, 2600);
  dust.push({ v: [Math.cos(th) * Math.sin(ph) * sp, Math.sin(th) * Math.sin(ph) * sp, -Math.cos(ph) * sp * rr(0.4, 1)], sz: rr(1.5, 5), rot: rr(0, 6), life: rr(2.2, 4.6), d: rr(0, 0.12) });
}
function drawDust(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of dust) {
    const u = t - T_BREAK - p.d; if (u <= 0 || u > p.life) continue;
    const e = (1 - Math.exp(-u * 2.6)) / 2.6;
    const P = [IMPACT[0] + p.v[0] * e, IMPACT[1] + p.v[1] * e + 90 * u * u, p.v[2] * e];
    const s = proj(P); if (s[2] < 60) continue;
    const a = (1 - u / p.life) * 0.9, sz = p.sz * F / s[2];
    ctx.fillStyle = `rgba(255,248,225,${a})`;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) { const an = p.rot + u * 6 + k * 2.1; ctx.lineTo(s[0] + Math.cos(an) * sz, s[1] + Math.sin(an) * sz); }
    ctx.fill();
  }
  ctx.restore();
}

function drawShards(t) {
  const chrome = sstep(8.7, 9.9, t) * (1 - sstep(T_BACK0, T_BACK0 + 1.2, t));
  const L = LIGHT;
  const list = [];
  for (const s of shards) {
    const [P, q, sc] = shardState(s, t);
    const m = qMat(q);
    const world = s.local.map(v => add(P, mul(mv(m, v), sc)));
    const cs = world.map(proj);
    if (cs.some(p => p[2] < 40)) continue;
    const cc = proj(P);
    const nB = mv(m, [0, 0, 1]);                 // back-face normal
    const view = norm(sub(cam.P, P));
    const backVisible = dot(nB, view) > 0;
    const n = backVisible ? nB : mul(nB, -1);
    const Ls = 60;
    const ex = proj(add(P, mul(mv(m, [Ls, 0, 0]), sc))), ey = proj(add(P, mul(mv(m, [0, Ls, 0]), sc)));
    const a = (ex[0] - cc[0]) / Ls, b = (ex[1] - cc[1]) / Ls, c2 = (ey[0] - cc[0]) / Ls, d2 = (ey[1] - cc[1]) / Ls;
    // pattern matrix: texture pixel -> screen
    const tx = -W / 2 - s.c[0], ty = -H / 2 - s.c[1];
    const mat = new DOMMatrix([a, b, c2, d2, cc[0] + a * tx + c2 * ty, cc[1] + b * tx + d2 * ty]);
    const moved = Math.min(1, (Math.hypot(P[0] - s.c[0], P[1] - s.c[1], P[2]) + Math.abs(sc - 1) * 400) / 60);
    list.push({ s, cs, z: cc[2], mat, backVisible, n, view, moved });
  }
  list.sort((p, q) => q.z - p.z);
  ctx.lineJoin = 'round';
  for (const it of list) {
    const { cs, mat, backVisible, n, view, moved } = it;
    pathPoly(cs);
    const pat = backVisible ? patB : patA;
    pat.setTransform(mat);
    ctx.fillStyle = pat; ctx.fill();
    // shading: diffuse + mirror
    const facing = Math.abs(dot(n, view));
    const diff = Math.max(0, dot(n, L));
    const shade = (1 - (0.55 + 0.45 * diff)) * 0.42 * moved + (1 - facing) * 0.28 * moved;
    if (shade > 0.01) { ctx.fillStyle = `rgba(8,9,14,${shade.toFixed(3)})`; ctx.fill(); }
    const rv = sub(mul(n, 2 * dot(n, view)), view);  // reflected view dir
    if (backVisible && chrome > 0.01) {
      const e = env(rv);
      ctx.fillStyle = `rgba(${e[0] | 0},${e[1] | 0},${e[2] | 0},${(0.86 * chrome).toFixed(3)})`; ctx.fill();
    }
    const spec = Math.pow(Math.max(0, dot(rv, L)), 24) * moved;
    if (spec > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,250,235,${(spec * 0.85).toFixed(3)})`; ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    // edges: dark crack while resting, lit glass rim when flying
    ctx.strokeStyle = `rgba(17,18,22,${(0.7 * (1 - moved)).toFixed(3)})`; ctx.lineWidth = 2; ctx.stroke();
    if (moved > 0.02) { ctx.strokeStyle = `rgba(235,250,255,${(moved * (0.28 + 0.7 * spec + 0.25 * (1 - facing))).toFixed(3)})`; ctx.lineWidth = 1.6; ctx.stroke(); }
  }
  return list;
}

// mirror-ball reflections thrown onto the dark
function drawSpots(t) {
  const amt = sstep(9.4, 10.4, t) * (1 - sstep(T_BACK0, T_BACK0 + 0.8, t));
  if (amt <= 0) return;
  const c = proj(SPH_C);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i += 2) {
    const s = shards[i];
    const [P, q] = sphereState(s, t);
    const n = mv(qMat(q), [0, 0, 1]);
    const r = sub(mul(n, 2 * dot(n, L0)), L0);
    const rc = [dot(r, cam.r), dot(r, cam.d), dot(r, cam.f)];
    if (rc[2] > 0.2) continue;                   // only those thrown back towards us, onto the walls
    const x = c[0] + rc[0] * 1250, y = c[1] + rc[1] * 900;
    const a = amt * 0.35 * clamp(-rc[2] * 1.5);
    const g = ctx.createRadialGradient(x, y, 0, x, y, 26);
    g.addColorStop(0, `rgba(255,240,215,${a})`); g.addColorStop(1, 'rgba(255,240,215,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 26, y - 26, 52, 52);
  }
  ctx.restore();
}
const L0 = mul(LIGHT, -1);

function phaseName(t) {
  if (t < T_BREAK) return '01  IMPACT';
  if (t < 3.0) return '02  BURST';
  if (t < T_ANA0 + 0.4) return '03  SUSPEND';
  if (t < T_ALIGN1) return '04  ALIGN';
  if (t < 9.6) return '05  PARALLAX';
  if (t < T_BACK0) return '06  MIRROR BALL';
  return '07  RESTORE';
}
function drawHUD(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'difference';
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 20px "JetBrains Mono"'; ctx.textBaseline = 'top';
  ctx.textAlign = 'left'; ctx.fillText('MIDDLE STUDIES   REEL — 022', 40, 30);
  ctx.textAlign = 'right'; ctx.fillText(phaseName(t), W - 40, 30);
  ctx.textBaseline = 'bottom'; ctx.font = '500 20px "JetBrains Mono"';
  ctx.textAlign = 'left';
  const yaw = (cam.yaw * 180 / Math.PI), pit = (cam.pit * 180 / Math.PI);
  const sg = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1).padStart(4, '0');
  ctx.fillText(`${N} SHARDS   VIEW ${sg(yaw)}°  ${sg(pit)}°   t ${t.toFixed(2).padStart(5, '0')}`, 40, H - 28);
  ctx.textAlign = 'right'; ctx.fillText('Claude', W - 40, H - 28);
  ctx.restore();
}

function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  setCamera(t);
  drawBackground(t);
  const atRest = t < T_BREAK || t >= T_REST;
  if (atRest) {
    const m = paneScreen();
    ctx.save(); ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]); ctx.drawImage(texA, 0, 0); ctx.restore();
    if (t < T_BREAK && t >= T_HIT) drawCracks(t, 1, 2600 * eoExpo((t - T_HIT) / 0.22));
    if (t >= T_REST) drawCracks(t, 1 - sstep(T_REST + 0.05, 14.92, t), 1e9);
  } else {
    drawShards(t);
    drawSpots(t);
    drawDust(t);
  }
  // the hit: a flash
  const fl = t >= T_HIT ? Math.exp(-(t - T_HIT) * 9) * (t < 1.2 ? 1 : 0) : 0;
  if (fl > 0.01) {
    const p = proj([IMPACT[0], IMPACT[1], 0]);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 520);
    g.addColorStop(0, `rgba(255,255,255,${0.95 * fl})`); g.addColorStop(0.25, `rgba(255,240,200,${0.4 * fl})`); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  drawHUD(t);
}

const ready = (async () => {
  await document.fonts.load('800 300px "Bricolage Grotesque"');
  await document.fonts.load('italic 900 300px "Fraunces"');
  await document.fonts.load('700 20px "JetBrains Mono"');
  await document.fonts.load('500 20px "JetBrains Mono"');
  await document.fonts.ready;
  buildTextures();
})();
ready.then(() => {
  window.__seek = t => render(t);
  if (!location.search.includes('render')) {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
