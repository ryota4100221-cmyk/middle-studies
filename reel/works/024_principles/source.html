<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REEL — 024 Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Sometype+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #1f1a3a; overflow: hidden; }
  svg { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// REEL — 024 Principles. One dot, hand-keyed: every pose is a function of time.
// Four scenes; at each cut the ball grows to fill the frame and its colour becomes the next background.
window.__duration = 15;
window.__poster = 5.0;

const W = 1920, H = 1080;
const AUB = '#1f1a3a', PINK = '#ff8fb1', GREEN = '#00a67e', YEL = '#ffd23f';
const DISPLAY = "'Bagel Fat One'", MONO = "'Sometype Mono'";
const FILL_R = 1200;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, s) => a + (b - a) * s;
const seg = (T, a, b) => clamp((T - a) / (b - a));
const inCubic = p => p * p * p;
const outCubic = p => 1 - Math.pow(1 - p, 3);
const inOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const outBack = (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const outElastic = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
const resp = d => d < 0 ? 0 : Math.exp(-d * 7) * Math.cos(d * 26);   // damped spring after an impact
const f1 = v => (Math.round(v * 10) / 10);

let out = [];
const E = s => out.push(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function ellipse(x, y, rx, ry, rot, fill, extra = '') {
  E(`<ellipse cx="0" cy="0" rx="${f1(Math.max(0, rx))}" ry="${f1(Math.max(0, ry))}" fill="${fill}" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)})" ${extra}/>`);
}
function circle(x, y, r, fill, extra = '') {
  E(`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(Math.max(0, r))}" fill="${fill}" ${extra}/>`);
}
function text(x, y, s, size, fill, opts = {}) {
  const fam = opts.family || MONO, anchor = opts.anchor || 'start', w = opts.weight || 400;
  const tr = opts.transform ? ` transform="${opts.transform}"` : '';
  const tl = opts.textLength ? ` textLength="${opts.textLength}" lengthAdjust="spacingAndGlyphs"` : '';
  const op = opts.opacity !== undefined ? ` opacity="${f1(opts.opacity * 100) / 100}"` : '';
  const ls = opts.ls ? ` letter-spacing="${opts.ls}"` : '';
  E(`<text x="${f1(x)}" y="${f1(y)}" font-family="${fam}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}"${tr}${tl}${op}${ls}>${esc(s)}</text>`);
}
// velocity stretch: elongate along the direction of travel, keep the area
function speedBall(posFn, T, r, fill, maxSt = 0.38) {
  const h = 1 / 240, a = posFn(T - h), b = posFn(T + h), p = posFn(T);
  const vx = (b.x - a.x) / (2 * h), vy = (b.y - a.y) / (2 * h), v = Math.hypot(vx, vy);
  const st = Math.min(maxSt, v * 0.00011);
  ellipse(p.x, p.y, r * (1 + st), r / (1 + st), Math.atan2(vy, vx) * 180 / Math.PI, fill);
  return p;
}
// the ball that grows into the next background
function fillBall(T, t0, t1, x0, y0, r0, fill) {
  const s = seg(T, t0, t1);
  const m = outCubic(seg(T, t0, t0 + 0.3));
  const r = r0 * Math.pow(FILL_R / r0, inCubic(s));
  const e = seg(T, t0, t0 + 0.32), st = 0.55 * Math.pow(1 - e, 2);
  ellipse(lerp(x0, 960, m), lerp(y0, 540, m), r / (1 + st), r * (1 + st), 0, fill);
}

// ───────────────────────── HUD
const LABELS = [
  [0, '01', 'SQUASH & STRETCH'], [2.45, '02', 'ANTICIPATION'],
  [3.6, '03', 'EASING'], [4.72, '04', 'OVERSHOOT'],
  [7.2, '05', 'OVERLAP & STAGGER'], [9.85, '06', 'FOLLOW-THROUGH'],
  [10.8, '07', 'ARCS'], [13.3, '08', 'TIMING'],
];
function hud(T, fg, scene) {
  const tc = (T + 14.4) % 15;           // real seconds (T is shifted by 0.6 s)
  const fr = Math.floor(tc * 60 + 1e-6);
  text(64, 74, 'MIDDLE STUDIES', 20, fg, { weight: 600, ls: 2 });
  text(282, 74, 'REEL — 024', 20, fg, { ls: 2 });
  text(1856, 74, 'PRINCIPLES OF MOTION', 20, fg, { anchor: 'end', weight: 600, ls: 2 });
  let k = 0; for (let i = 0; i < LABELS.length; i++) if (T >= LABELS[i][0]) k = i;
  const [ts, num, name] = LABELS[k];
  const e = outCubic(seg(T, ts, ts + 0.22));
  E(`<g transform="translate(0 ${f1(18 * (1 - e))})" opacity="${f1(e * 100) / 100}">`);
  text(64, 1026, num, 22, fg, { weight: 600 });
  text(108, 1026, name, 22, fg, { weight: 600, ls: 2 });
  E('</g>');
  // scene pips
  for (let i = 0; i < 4; i++) {
    const x = 930 + i * 20;
    if (i === scene) circle(x, 1019, 6, fg); else circle(x, 1019, 5, 'none', `stroke="${fg}" stroke-width="2"`);
  }
  text(1856, 1026, 'Claude', 22, fg, { anchor: 'end', weight: 600 });
  text(1720, 1026, String(fr).padStart(3, '0') + 'f', 20, fg, { anchor: 'end', opacity: 0.7 });
}

// ───────────────────────── A · squash & stretch → anticipation (aubergine / pink)
const FLOOR = 860, RA = 80;
const IMP = [0.75, 1.45, 1.95, 2.3, 2.52], HTS = [520, 260, 110, 28];
const AMP = [0.44, 0.32, 0.2, 0.1, 0.05];
function aH(T) {
  if (T < 0.75) { const s = seg(T, 0.05, 0.75); return 1150 * (1 - s * s); }
  for (let k = 0; k < 4; k++) if (T < IMP[k + 1]) { const s = (T - IMP[k]) / (IMP[k + 1] - IMP[k]); return HTS[k] * 4 * s * (1 - s); }
  return 0;
}
const aX = T => lerp(620, 960, outCubic(seg(T, 0.05, 2.4)));
function aSquash(T) {
  let q = 0;
  for (let k = 0; k < IMP.length; k++) {
    const d = T - IMP[k];
    if (d > -0.025 && d < 0.08) q = Math.max(q, AMP[k] * (d < 0 ? 1 + d / 0.025 : Math.pow(1 - d / 0.08, 1.5)));
  }
  return q;
}
function sceneA(T) {
  E(`<rect width="${W}" height="${H}" fill="${AUB}"/>`);
  // background word reacts to every impact
  let word = 'SQUASH', sy = 1;
  for (let k = 0; k < IMP.length; k++) sy -= AMP[k] * 0.55 * resp(T - IMP[k]);
  const c = inOutCubic(seg(T, 2.5, 2.95));
  sy -= 0.32 * c * (T < 3 ? 1 : 0);
  if (T >= 3.0) { word = 'STRETCH'; const d = T - 3.0; sy = 1 + 0.8 * Math.exp(-d * 5) * Math.cos(d * 14); }
  text(0, 0, word, 400, '#30285c', { family: DISPLAY, anchor: 'middle', textLength: 1640, transform: `translate(960 ${FLOOR}) scale(1 ${f1(sy * 1000) / 1000})` });
  E(`<line x1="0" y1="${FLOOR}" x2="${W}" y2="${FLOOR}" stroke="#40387a" stroke-width="3"/>`);
  // impact rings on the floor
  for (let k = 0; k < 3; k++) {
    const p = seg(T, IMP[k], IMP[k] + 0.6);
    if (p <= 0 || p >= 1) continue;
    const rx = 90 + 560 * outCubic(p);
    E(`<ellipse cx="${f1(aX(IMP[k]))}" cy="${FLOOR}" rx="${f1(rx)}" ry="${f1(rx * 0.14)}" fill="none" stroke="${PINK}" stroke-width="${f1(9 * (1 - p))}" opacity="${f1((1 - p) * 100) / 100}"/>`);
  }
  if (T < 3.0) {
    const h = aH(T), x = aX(T);
    // contact shadow
    const sh = clamp(1 - h / 900);
    if (T > 0.1) ellipse(x, FLOOR + 3, RA * (0.4 + 0.75 * sh) * (1 + 0.3 * c), 12 * sh + 4, 0, '#120e26', `opacity="${f1(sh * 80) / 100}"`);
    const q = aSquash(T);
    if (T >= 2.45) {
      // anticipation: sink, hold, then snap
      const tremble = T > 2.8 ? Math.sin(T * 140) * 2.5 * seg(T, 2.8, 2.95) : 0;
      const ry = RA * (1 - 0.4 * c), rx = RA * (1 + 0.32 * c);
      ellipse(x + tremble, FLOOR - ry, rx, ry, 0, PINK);
    } else if (q > 0.001) {
      const ry = RA * (1 - q), rx = RA * (1 + q * 0.85);
      ellipse(x, FLOOR - h - ry, rx, ry, 0, PINK);
    } else {
      speedBall(t => ({ x: aX(t), y: FLOOR - aH(t) - RA }), T, RA, PINK);
    }
  } else {
    fillBall(T, 3.0, 3.6, 960, FLOOR - RA * 0.6, RA, PINK);
  }
}

// ───────────────────────── B · easing / overshoot (pink / green) — a live graph editor
const GX0 = 220, GX1 = 900, V0 = 800, V1 = 440, BX = 1440, RB = 70;
const vy = v => lerp(V0, V1, v);
const MOVES = [
  { a: 3.92, b: 4.68, ease: inOutCubic, name: 'ease-in-out', from: 0, to: 1 },
  { a: 4.82, b: 5.58, ease: p => outBack(p, 2.6), name: 'overshoot', from: 1, to: 0 },
  { a: 5.72, b: 6.55, ease: outElastic, name: 'elastic', from: 0, to: 1 },
];
const mv = (m, p) => lerp(m.from, m.to, m.ease(clamp(p)));
function bValue(T) {
  let v = 0;
  for (const m of MOVES) if (T >= m.a) v = mv(m, (T - m.a) / (m.b - m.a));
  return v;
}
function bBallPos(T) {
  if (T < 3.86) { // pops at the centre, then hops to its start key
    const e = inOutCubic(seg(T, 3.7, 3.88));
    return { x: lerp(960, BX, e), y: lerp(540, vy(0), e) - 140 * Math.sin(Math.PI * e) };
  }
  return { x: BX, y: vy(bValue(T)) };
}
function sceneB(T) {
  E(`<rect width="${W}" height="${H}" fill="${PINK}"/>`);
  const ga = outCubic(seg(T, 3.62, 4.0)) * (1 - outCubic(seg(T, 6.62, 6.9)));
  if (ga > 0.002) {
    E(`<g opacity="${f1(ga * 100) / 100}">`);
    const L = ga;
    // grid
    for (let i = 0; i <= 4; i++) {
      const y = vy(i / 4), x = lerp(GX0, GX1, i / 4);
      E(`<line x1="${GX0}" y1="${f1(y)}" x2="${f1(lerp(GX0, GX1, L))}" y2="${f1(y)}" stroke="${AUB}" stroke-opacity="0.14" stroke-width="2"/>`);
      E(`<line x1="${f1(x)}" y1="${V0 + 40}" x2="${f1(x)}" y2="${f1(lerp(V0 + 40, V1 - 70, L))}" stroke="${AUB}" stroke-opacity="0.14" stroke-width="2"/>`);
    }
    E(`<line x1="${GX0}" y1="${V0 + 40}" x2="${GX0}" y2="${f1(lerp(V0 + 40, V1 - 90, L))}" stroke="${AUB}" stroke-width="4"/>`);
    E(`<line x1="${GX0 - 20}" y1="${V0}" x2="${f1(lerp(GX0 - 20, GX1 + 30, L))}" y2="${V0}" stroke="${AUB}" stroke-width="4"/>`);
    text(GX0 - 24, V1 + 7, '1.0', 20, AUB, { anchor: 'end' });
    text(GX0 - 24, V0 + 7, '0.0', 20, AUB, { anchor: 'end' });
    text(GX1, V0 + 46, 'time →', 20, AUB, { anchor: 'end' });
    text(GX0 + 14, V1 - 72, 'value', 20, AUB);

    // which curve is on the editor (morphs into the next one just before its move)
    let k = 0; for (let i = 0; i < MOVES.length; i++) if (T >= MOVES[i].a - 0.16) k = i;
    const m = MOVES[k], prev = MOVES[Math.max(0, k - 1)];
    const morph = k === 0 ? 1 : inOutCubic(seg(T, m.a - 0.16, m.a));
    const pts = [], N = 96;
    for (let i = 0; i <= N; i++) {
      const p = i / N, v = lerp(mv(prev, p), mv(m, p), morph);
      pts.push([lerp(GX0, GX1, p), vy(v)]);
    }
    const pAt = seg(T, m.a, m.b);
    const poly = a => a.map(q => f1(q[0]) + ',' + f1(q[1])).join(' ');
    E(`<polyline points="${poly(pts)}" fill="none" stroke="${AUB}" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`);
    const done = pts.slice(0, Math.max(1, Math.round(pAt * N)) + 1);
    if (T >= m.a) E(`<polyline points="${poly(done)}" fill="none" stroke="${AUB}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`);
    // bezier handles for the cubic
    const hv = k === 0 ? 1 - seg(T, 4.72, 4.86) : 0;
    if (hv > 0) {
      const hx = lerp(GX0, GX1, 0.65), hx2 = lerp(GX0, GX1, 0.35);
      E(`<g opacity="${f1(hv * 100) / 100}" stroke="${AUB}" stroke-width="3">`);
      E(`<line x1="${GX0}" y1="${V0}" x2="${f1(hx)}" y2="${V0}"/><line x1="${GX1}" y1="${V1}" x2="${f1(hx2)}" y2="${V1}"/>`);
      E(`<rect x="${f1(hx - 10)}" y="${V0 - 10}" width="20" height="20" fill="${PINK}"/><rect x="${f1(hx2 - 10)}" y="${V1 - 10}" width="20" height="20" fill="${PINK}"/>`);
      E('</g>');
      circle(GX0, V0, 9, AUB); circle(GX1, V1, 9, AUB);
    }
    // name of the curve
    const ne = outBack(seg(T, m.a - 0.16, m.a + 0.14), 2.2);
    text(GX0, 214, m.name, 76, AUB, { family: DISPLAY, transform: `translate(0 ${f1(30 * (1 - ne))})`, opacity: clamp(ne) });
    text(GX0 + 4, 268, ['cubic-bezier(.65,0,.35,1)', 'back-out  s = 2.6', 'elastic-out'][k], 20, AUB, { opacity: 0.75 * clamp(ne) });
    // playhead + link to the ball
    if (T >= m.a - 0.05) {
      const px = lerp(GX0, GX1, pAt), py = vy(lerp(mv(prev, pAt), mv(m, pAt), morph));
      E(`<line x1="${f1(px)}" y1="${V0 + 40}" x2="${f1(px)}" y2="${V1 - 70}" stroke="${AUB}" stroke-width="2"/>`);
      E(`<line x1="${f1(px)}" y1="${f1(py)}" x2="${BX}" y2="${f1(py)}" stroke="${AUB}" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 10"/>`);
      circle(px, py, 15, GREEN, `stroke="${AUB}" stroke-width="4"`);
    }
    // the ball's rail
    E(`<line x1="${BX}" y1="${V1 - 100}" x2="${BX}" y2="${V0 + 100}" stroke="${AUB}" stroke-opacity="0.18" stroke-width="2"/>`);
    // onion skin: one ghost every 3 frames = the spacing the curve makes
    for (const mm of MOVES) {
      const fade = 1 - seg(T, mm.b + 0.1, mm.b + 0.5);
      if (T < mm.a || fade <= 0) continue;
      for (let f = 0; ; f++) {
        const tt = mm.a + f / 20;
        if (tt > Math.min(T, mm.b) + 1e-6) break;
        const y = vy(mv(mm, (tt - mm.a) / (mm.b - mm.a)));
        circle(BX, y, RB, 'none', `stroke="${AUB}" stroke-width="3" stroke-opacity="${f1(0.45 * fade * 100) / 100}"`);
        E(`<line x1="${BX + RB + 24}" y1="${f1(y)}" x2="${BX + RB + 50}" y2="${f1(y)}" stroke="${AUB}" stroke-width="3" opacity="${f1(fade * 100) / 100}"/>`);
      }
    }
    E('</g>');
  }
  if (T < 6.7) {
    const pop = outBack(seg(T, 3.6, 3.74), 2.4);
    speedBall(bBallPos, T, RB * pop, GREEN, 0.45);
  } else {
    fillBall(T, 6.7, 7.2, BX, vy(1), RB, GREEN);
  }
}

// ───────────────────────── C · overlap & stagger → follow-through (green / yellow)
const NC = 12, RC0 = 90, RC = 42;
const ordC = i => Math.abs(i - (NC - 1) / 2);
function cPos(i, T) {
  const ctr = { x: 960, y: 520 };
  const e1 = outBack(seg(T, 7.42 + ordC(i) * 0.045, 7.42 + ordC(i) * 0.045 + 0.36), 1.9);
  const lx = 960 + (i - (NC - 1) / 2) * 132;
  const env = seg(T, 7.95, 8.2) * (1 - seg(T, 8.85, 9.15));
  const ly = 520 - 190 * env * Math.sin(2 * Math.PI * 1.55 * (T - 7.95) - i * 0.5);
  const e2 = inOutCubic(seg(T, 8.95 + i * 0.035, 8.95 + i * 0.035 + 0.42));
  const rot = 1.25 * Math.PI * inOutCubic(seg(T, 9.1, 10.05));
  const ang = i / NC * 2 * Math.PI - Math.PI / 2 + rot;
  const cx = 960 + 300 * Math.cos(ang), cy = 520 + 300 * Math.sin(ang);
  const e3 = inCubic(seg(T, 9.86 + i * 0.022, 9.86 + i * 0.022 + 0.26));
  let x = lerp(ctr.x, lx, e1), y = lerp(ctr.y, ly, e1);
  x = lerp(x, cx, e2); y = lerp(y, cy, e2);
  x = lerp(x, ctr.x, e3); y = lerp(y, ctr.y, e3);
  return { x, y, e1, e3 };
}
const cKeys = i => [7.42 + ordC(i) * 0.045, 7.95, 8.95 + i * 0.035, 9.86 + i * 0.022];
function sceneC(T) {
  E(`<rect width="${W}" height="${H}" fill="${GREEN}"/>`);
  const mergedAt = 9.86 + (NC - 1) * 0.022 + 0.26;
  // chain through the ball centres (shows the phase offset)
  const ca = seg(T, 7.85, 8.05) * (1 - seg(T, 9.7, 9.9));
  if (ca > 0) {
    const pts = []; for (let i = 0; i < NC; i++) { const p = cPos(i, T); pts.push(f1(p.x) + ',' + f1(p.y)); }
    E(`<polyline points="${pts.join(' ')}" fill="none" stroke="${AUB}" stroke-width="3" stroke-opacity="${f1(ca * 40) / 100}" stroke-linejoin="round"/>`);
  }
  if (T < mergedAt) {
    const pop = outBack(seg(T, 7.2, 7.36), 2.4);
    for (let i = NC - 1; i >= 0; i--) {
      const p = cPos(i, T);
      const r = lerp(RC0 * pop, RC, p.e1);
      speedBall(t => cPos(i, t), T, lerp(r, 60, p.e3), YEL, 0.5);
    }
  } else if (T < 10.32) {
    // follow-through: the merged ball keeps wobbling after the stop
    const d = T - mergedAt, w = 0.28 * Math.exp(-d * 9) * Math.cos(d * 38);
    ellipse(960, 520, RC0 * (1 + w), RC0 * (1 - w), 0, YEL);
  } else {
    fillBall(T, 10.32, 10.8, 960, 520, RC0, YEL);
  }
  // dope sheet
  const da = seg(T, 7.3, 7.6) * (1 - seg(T, 10.3, 10.5));
  if (da > 0) {
    const X0 = 1240, X1 = 1840, Y0 = 790, RH = 17;
    const tx = t => lerp(X0, X1, (t - 7.2) / 3.6);
    E(`<g opacity="${f1(da * 100) / 100}">`);
    text(X0, Y0 - 26, 'DOPE SHEET · 12 LAYERS · STAGGER 35 ms', 18, AUB, { weight: 600 });
    for (let i = 0; i < NC; i++) {
      const y = Y0 + i * RH;
      E(`<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="${AUB}" stroke-opacity="0.18" stroke-width="1.5"/>`);
      for (const k of cKeys(i)) {
        const x = tx(k), lit = T >= k;
        E(`<rect x="${f1(x - 7)}" y="${y - 7}" width="14" height="14" transform="rotate(45 ${f1(x)} ${y})" fill="${lit ? YEL : 'none'}" stroke="${AUB}" stroke-width="2"/>`);
      }
    }
    const px = tx(T);
    E(`<line x1="${f1(px)}" y1="${Y0 - 12}" x2="${f1(px)}" y2="${Y0 + NC * RH}" stroke="${AUB}" stroke-width="2.5"/>`);
    E('</g>');
  }
}

// ───────────────────────── D · arcs → timing (yellow / aubergine), the dot types the title
let LET = null;         // measured at load
const BASE = 690, RD = 34;
let HOPS = null, WORDX0 = 0, WORDW = 0, PERIOD = null;
function measure() {
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `300px ${DISPLAY}`;
  const chars = ['p', 'r', 'ı', 'n', 'c', 'ı', 'p', 'l', 'e', 's'];
  const tr = -6;
  let w = 0; const L = [];
  for (const ch of chars) { const m = ctx.measureText(ch); L.push({ ch, adv: m.width, asc: m.actualBoundingBoxAscent }); w += m.width + tr; }
  WORDW = w; const total = w + 90; WORDX0 = 960 - total / 2;
  let x = WORDX0; for (let j = 0; j < L.length; j++) { L[j].x = x + L[j].adv / 2; L[j].left = x; x += L[j].adv + tr; }
  LET = L;
  PERIOD = { x: x + 34, y: BASE - RD };
  const top = j => ({ x: L[j].x + (L[j].ch === 'r' ? -L[j].adv * 0.18 : 0), y: BASE - L[j].asc - RD, j });
  HOPS = [
    { t: 11.22, x: -90, y: 330, j: -1 },
    { t: 11.62, ...top(0) },
    { t: 11.98, ...top(2), stamp: true },
    { t: 12.32, ...top(5), stamp: true },
    { t: 12.64, ...top(7) },
    { t: 12.94, ...top(9) },
    { t: 13.28, x: PERIOD.x, y: PERIOD.y, j: -1 },
    { t: 13.5, x: PERIOD.x, y: PERIOD.y, j: -1 },
    { t: 13.64, x: PERIOD.x, y: PERIOD.y, j: -1 },
  ];
}
function dPos(T) {
  if (T <= HOPS[0].t) return { x: HOPS[0].x, y: HOPS[0].y };
  for (let k = 1; k < HOPS.length; k++) {
    const a = HOPS[k - 1], b = HOPS[k];
    if (T < b.t) {
      const s = (T - a.t) / (b.t - a.t);
      const Hh = k === 1 ? 60 : k === 7 ? 46 : k === 8 ? 14 : 130 + Math.abs(b.x - a.x) * 0.12;
      return { x: lerp(a.x, b.x, s), y: lerp(a.y, b.y, s) - 4 * Hh * s * (1 - s) };
    }
  }
  return { x: PERIOD.x, y: PERIOD.y };
}
function dSquash(T) {
  let q = 0;
  for (let k = 1; k < HOPS.length; k++) {
    const d = T - HOPS[k].t, a = k >= 7 ? 0.12 : k === 6 ? 0.3 : 0.36;
    if (d > -0.02 && d < 0.075) q = Math.max(q, a * (d < 0 ? 1 + d / 0.02 : Math.pow(1 - d / 0.075, 1.5)));
  }
  return q;
}
function sceneD(T) {
  E(`<rect width="${W}" height="${H}" fill="${YEL}"/>`);
  // letters spring up from the baseline, one after another
  for (let j = 0; j < LET.length; j++) {
    const Lj = LET[j];
    const e = outBack(seg(T, 10.95 + j * 0.05, 10.95 + j * 0.05 + 0.34), 2.4);
    if (e <= 0) continue;
    let sy = e, sx = 1;
    for (const hp of HOPS) if (hp.j === j) { const r = resp(T - hp.t) * 0.2; sy -= r; sx += r * 0.5; }
    text(0, 0, Lj.ch, 300, AUB, { family: DISPLAY, anchor: 'middle', transform: `translate(${f1(Lj.x)} ${BASE}) scale(${f1(sx * 1000) / 1000} ${f1(sy * 1000) / 1000})` });
    // stamped tittle
    const hp = HOPS.find(h => h.j === j && h.stamp);
    if (hp) {
      const p = outBack(seg(T, hp.t + 0.06, hp.t + 0.3), 3);
      if (p > 0) circle(Lj.x, BASE - Lj.asc - 72, RD * p, AUB);
    }
  }
  // dotted arcs: the path the ball has travelled
  for (let k = 1; k < 7; k++) {
    const a = HOPS[k - 1], b = HOPS[k];
    const fade = 1 - seg(T, b.t + 0.1, b.t + 0.9);
    if (T < a.t || fade <= 0) continue;
    for (let tt = a.t; tt <= Math.min(T, b.t); tt += 0.022) {
      const p = dPos(tt); circle(p.x, p.y, 4.5, AUB, `opacity="${f1(fade * 55) / 100}"`);
    }
  }
  // subtitle
  const se = outCubic(seg(T, 13.35, 13.7)) * (1 - seg(T, 14.4, 14.6));
  if (se > 0) text(960, 830 + 16 * (1 - se), 'eight principles · one dot · 900 frames', 28, AUB, { anchor: 'middle', opacity: se, weight: 600, ls: 1 });
  // the ball
  if (T < 14.36) {
    if (T < HOPS[0].t) return;
    const q = dSquash(T);
    const c = inOutCubic(seg(T, 14.0, 14.33));
    if (T >= 13.64) {
      const tremble = T > 14.2 ? Math.sin(T * 150) * 2 * seg(T, 14.2, 14.33) : 0;
      const ry = RD * (1 - 0.42 * c), rx = RD * (1 + 0.34 * c);
      ellipse(PERIOD.x + tremble, BASE - ry, rx, ry, 0, AUB);
    } else if (q > 0.001) {
      const p = dPos(T), ry = RD * (1 - q), rx = RD * (1 + q * 0.85);
      ellipse(p.x, p.y + RD - ry, rx, ry, 0, AUB);
    } else speedBall(dPos, T, RD, AUB, 0.45);
  } else {
    fillBall(T, 14.36, 15.0, PERIOD.x, BASE - RD * 0.6, RD, AUB);
  }
}

// ───────────────────────── frame
const svg = document.getElementById('s');
function renderAt(t) {
  const T = ((t + 0.6) % 15 + 15) % 15;
  out = [];
  let scene, fg;
  if (T < 3.6) { sceneA(T); scene = 0; fg = PINK; }
  else if (T < 7.2) { sceneB(T); scene = 1; fg = AUB; }
  else if (T < 10.8) { sceneC(T); scene = 2; fg = AUB; }
  else { sceneD(T); scene = 3; fg = AUB; }
  hud(T, fg, scene);
  svg.innerHTML = out.join('');
}

const ready = Promise.all([
  document.fonts.load(`300px ${DISPLAY}`, 'principlesSQUASHTRETCHı'),

  if (!location.search.includes('render')) {
    const t0 = performance.now();
    const loop = now => { renderAt(((now - t0) / 1000) % 15); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else renderAt(0);
});
